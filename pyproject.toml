[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-pipeline"
version = "0.1.0"
description = "Lean, agent-native research pipeline for theoretical mathematics and physics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
numerics = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
]
symbolic = [
    "sympy>=1.13",
]
formal = [
    "z3-solver>=4.13",
]
jax = [
    "jax>=0.4.28",
]
all = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "sympy>=1.13",
    "z3-solver>=4.13",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
rpipe = "rpipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
